aid: bevi
name: Bevi
description: 'Bevi is a smart beverage-dispenser company that manufactures connected,
  filtered-water machines for offices and commercial spaces. Its IoT-enabled Standup
  and Countertop dispensers deliver still and sparkling water plus dozens of fruit
  flavors and functional enhancements (vitamins, electrolytes, energy, focus), connect
  directly to a building''s water supply, and track plastic bottles saved in real
  time. Bevi is backed by Bessemer Venture Partners, Techstars, and Trinity Ventures.
  No public developer API surface (OpenAPI, docs, or developer portal) was found during
  enrichment; this profile carries identity and domain-security signals only.'
